plugins { id 'com.android.application' }

android {
    namespace 'com.gastonpg.pgcontrol'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gastonpg.pgcontrol'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.tananaev:adblib:1.3'
}
