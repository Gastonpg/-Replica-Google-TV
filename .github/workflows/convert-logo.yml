name: Install original PG logo PNG
on:
  push:
    branches: [prueba-diseno-gemini]
    paths:
      - 'Code_Generated_Image.png'
      - '.github/workflows/convert-logo.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prueba-diseno-gemini
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy original PNG without altering transparency
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp Code_Generated_Image.png app/src/main/res/drawable-nodpi/pg_logo.png
          file app/src/main/res/drawable-nodpi/pg_logo.png
      - name: Commit logo resource
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/pg_logo.png
          if git diff --cached --quiet; then echo "Logo resource already matches original PNG"; exit 0; fi
          git commit -m "Use original transparent PG logo PNG"
          git pull --rebase origin prueba-diseno-gemini
          git push origin prueba-diseno-gemini
