name: Build PG Control Widgets Test

on:
  push:
    branches: [ "prueba-leanback-tarjetas", "leanback-multitarea-pg", "pg-launcher-banner-editor", "pg-control-widgets" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build PG Launcher and PG Control
        run: gradle assembleLeanbackTest assembleDebug --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PG-Control-Widgets-Test
          path: |
            app/build/outputs/apk/leanbackTest/*.apk
            pgcontrol/build/outputs/apk/debug/*.apk
          if-no-files-found: error
