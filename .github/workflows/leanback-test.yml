name: Build PG Leanback test APK

on:
  push:
    branches: [ "prueba-leanback-tarjetas", "leanback-multitarea-pg" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build isolated Leanback test APK
        run: gradle assembleLeanbackTest --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: PG-Leanback-Test
          path: app/build/outputs/apk/leanbackTest/*.apk
          if-no-files-found: error
