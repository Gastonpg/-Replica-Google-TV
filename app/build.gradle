plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
android {
    namespace 'com.gastonpg.replicagoogletv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gastonpg.replicagoogletv'
        minSdk 28
        targetSdk 29
        versionCode 3
        versionName '0.3.0'
    }

    // Keep the same isolated package identity as the previously installable
    // Leanback test launcher, so this build stays separate from the stable app.
    buildTypes {
        leanbackTest {
            initWith debug
            applicationIdSuffix '.bannereditor'
            versionNameSuffix '-widgets'
            debuggable true
            matchingFallbacks = ['debug']
        }
    }
}
