plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
android {
    namespace 'com.gastonpg.replicagoogletv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gastonpg.replicagoogletv'
        minSdk 28
        targetSdk 29
        versionCode 3
        versionName '0.3.0'
    }

    // Give the widgets test its own package so it installs alongside prior builds.
    buildTypes {
        leanbackTest {
            initWith debug
            applicationIdSuffix '.widgets'
            versionNameSuffix '-widgets'
            debuggable true
            matchingFallbacks = ['debug']
        }
    }
}
