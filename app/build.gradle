plugins {
    id 'com.android.application'
}
android {
    namespace 'com.gastonpg.replicagoogletv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gastonpg.replicagoogletv'
        minSdk 28
        targetSdk 29
        versionCode 2
        versionName '0.2.0'
    }

    // Separate package for testing: it cannot overwrite the stable PG launcher.
    buildTypes {
        leanbackTest {
            initWith debug
            applicationIdSuffix '.leanbackmultitask'
            versionNameSuffix '-leanback-multitask'
            debuggable true
            matchingFallbacks = ['debug']
        }
    }
}
